name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # The watchdog is POSIX-only and declines to arm elsewhere. macOS and
          # Windows run once each to keep that path honest rather than assumed.
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    # uv picks its own interpreter unless told otherwise, so without this the
    # version matrix is decorative — every job runs whatever uv resolves.
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # No uv.lock is committed: a library should resolve fresh in CI, so
          # the cache is keyed on the declared dependencies instead.
          cache-dependency-glob: "pyproject.toml"
      - name: Install
        run: uv sync --group dev
      - name: Confirm the interpreter is the one this job claims
        shell: bash
        run: |
          ACTUAL="$(uv run python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          echo "requested ${{ matrix.python }}, running $ACTUAL"
          [ "$ACTUAL" = "${{ matrix.python }}" ]
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing
      - name: Enforce the coverage floor
        # Only where the whole package runs. The OOM watchdog is POSIX-only and
        # declines to arm on Windows, so its lines are legitimately unreached
        # there and the floor would measure the platform, not the tests.
        if: runner.os == 'Linux'
        run: uv run coverage report --fail-under=90

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # No uv.lock is committed: a library should resolve fresh in CI, so
          # the cache is keyed on the declared dependencies instead.
          cache-dependency-glob: "pyproject.toml"
      - run: uv sync --group dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  build:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Validate metadata
        run: uvx twine check --strict dist/*
      - name: Install the wheel into a clean environment and run the CLI
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/runnotify --version
          /tmp/smoke/bin/runnotify --list-channels
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
